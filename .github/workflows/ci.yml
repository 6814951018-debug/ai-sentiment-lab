name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/python-version@v4
      with:
        python-version: '3.10'

    - name: Install Basic Requirements
      run: |
        python -m pip install --upgrade pip
        pip install streamlit textblob nltk
        python -m nltk.downloader nltk_data Corpora/movie_reviews Punkt

    - name: Verify Code Syntax
      run: |
        python -m py_compile app.py
